[project]
name = "cadence"
version = "0.1.0"
description = "Standalone Email Service Provider for OTTO auto insurance remarketing."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.1",
    "uuid-utils>=0.9",
    "structlog>=24",
    "prometheus-client>=0.20",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "boto3>=1.35",
    "itsdangerous>=2.2",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
