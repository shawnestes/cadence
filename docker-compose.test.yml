services:
  test-db:
    image: postgres:16
    container_name: cadence-test-db
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence
      POSTGRES_DB: cadence_test
    ports:
      - "5433:5432"
    # tmpfs keeps the DB in memory: fast, and a fresh slate on every container restart
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence -d cadence_test"]
      interval: 2s
      timeout: 3s
      retries: 15
