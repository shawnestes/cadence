[project]
name = "cadence-unsub-server"
version = "0.1.0"
description = "Standalone unsubscribe server for cadence sending domains"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "itsdangerous>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "uuid-utils>=0.9",
    "structlog>=24",
]

[tool.uv]
package = false
